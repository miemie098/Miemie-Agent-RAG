# Miemie-Agent-RAG Kubernetes 部署清单
# ==========================================
# ⚠️ 部署前必须先创建 Secret:
#   kubectl create secret generic miemie-rag-secrets \
#     --from-literal=DEEPSEEK_API_KEY=<你的真实Key>
# ==========================================

---
apiVersion: v1
kind: Secret
metadata:
  name: miemie-rag-secrets
  labels:
    app: miemie-rag
type: Opaque
stringData:
  # ⚠️ 部署前替换为真实 Key，或通过 kubectl create secret 命令注入
  DEEPSEEK_API_KEY: "your-deepseek-api-key-here"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: miemie-rag-deployment
  labels:
    app: miemie-rag
spec:
  replicas: 3
  selector:
    matchLabels:
      app: miemie-rag
  template:
    metadata:
      labels:
        app: miemie-rag
    spec:
      containers:
      - name: rag-container
        image: miemie-rag-app:v1
        ports:
        - containerPort: 8000
        env:
        - name: DEEPSEEK_API_KEY
          valueFrom:
            secretKeyRef:
              name: miemie-rag-secrets
              key: DEEPSEEK_API_KEY
        # 资源限制
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "8Gi"
            cpu: "4"
        # 健康检查
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: miemie-rag-service
spec:
  type: NodePort
  selector:
    app: miemie-rag
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 31000
